<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopFlow E-Commerce - Products</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav aria-label="Main navigation">
    <a class="logo" href="index.html">ShopFlow</a>
    <a href="index.html">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span id="navHomeText">Home</span>
    </a>
    <a href="products.html" aria-current="page">
      <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span id="navProductsText">Products</span>
    </a>
    <a href="shoppingCart.html">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span id="navCartText">Shopping Cart</span>
    </a>
    <a href="tracking.html">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span id="navTrackingText">Track Order</span>
  </a>
<!-- Admin Restricted Nav Links -->
    <a href="stock.html" class="admin-only"><span id="navStockText">Stock</span></a>
    <a href="orders.html" class="admin-only"><span id="navOrdersText">Orders</span></a>

    <a href="login.html">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span id="navLoginText">Login</span>
    </a>
  </nav>
</header>

<main>
  <section id="products">
    <h2 id="productsTitle">Products</h2>

    <div class="cart-button-wrapper">
      <a class="cart-button" href="shoppingCart.html">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span id="btnGoCartText">Go to Shopping Cart</span>
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>

    <div class="filter-container">
      <label id="lblSearch" for="search">Search Products:</label>
      <input type="text" id="search" placeholder="Search products by name..." aria-label="Search products">

      <label id="lblCategory" for="categoryFilter">Filter by Category:</label>
      <select id="categoryFilter" aria-label="Filter products">
        <option value="" id="optAllCategories">All Categories</option>
        <option value="Electronics">Electronics</option>
        <option value="Fashion">Fashion</option>
        <option value="Accessories">Accessories</option>
        <option value="Sports">Sports</option>
      </select>
    </div>

    <p id="message" role="status" aria-live="polite"></p>
    <div id="productList" class="grid"></div>
  </section>
</main>

<footer>
  <p>&copy; 2026 ShopFlow E-Commerce</p>
</footer>

<script src="script.js"></script>
</body>
</html>
